name: Initial Import to CNB

on:
  workflow_dispatch:     # 手动触发

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub 仓库（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git 用户信息
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: 添加 CNB 远程仓库并推送代码
        run: |
          # 使用 Token 进行认证
          git remote add cnb https://${{ secrets.CNB_USERNAME }}:${{ secrets.CNB_TOKEN }}@cnb.cool/TurmoilZoom/Starward.git

          echo ">>> 正在强制推送 rebase/develop 分支到 CNB..."
          git push cnb rebase/develop --force

          echo ">>> 正在推送所有 Tag 到 CNB..."
          git push cnb --tags --force

          echo "✅ 初始导入完成！"

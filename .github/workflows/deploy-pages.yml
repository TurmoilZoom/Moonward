name: Deploy site

# 展示页部署：推送 gh-pages 源码即在 CI 构建并发布到 GitHub Pages。
# 产物只作为 Pages artifact 提供，不回写任何分支（docs/ 不再提交）。
# 前置：仓库 Settings → Pages → Source 设为 "GitHub Actions"。

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次发布，进行中的旧发布不打断（Pages 部署不宜中途取消）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

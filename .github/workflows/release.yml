name: Release

# 用 Velopack(vpk) 打包并发布到本仓库的 GitHub Releases。
# - 普通 tag（如 1.2.3）        → 稳定版（正式 release）
# - SemVer 预发布 tag（含 '-'，如 1.2.3-beta.1）→ 预览版（GitHub pre-release，对应「加入预览更新」）
# 每个架构使用独立渠道：win-x64 / win-arm64；安装版(Setup.exe)与便携版(zip)共用同一渠道的更新源。
# 增量(delta)更新由 Velopack 自动生成（打包前先 vpk download 拉取上一版本作为差分基准）。

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 1.2.3 or 1.2.3-beta.1 (used when triggered manually)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      Version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      RepoUrl: https://github.com/${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Install Velopack CLI
      run: dotnet tool install -g vpk

    - name: Build and pack (x64, arm64)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        # 原生命令(vpk)的非零退出不自动抛异常；改为手动检查 $LASTEXITCODE。
        # 这样首个版本无历史时 vpk download 失败可被忽略。
        $PSNativeCommandUseErrorActionPreference = $false
        $version = $env:Version
        # SemVer 预发布版本号含 '-'，发布为 GitHub pre-release（预览渠道）。
        $pre = $version.Contains("-")
        Write-Host "Version: $version, prerelease: $pre"

        foreach ($arch in @("x64", "arm64")) {
          $channel = "win-$arch"
          $pubDir = "publish/$arch"

          Write-Host "::group::Publish $channel"
          dotnet publish src/Starward/Starward.csproj -c Release -r "win-$arch" -p:Platform=$arch -p:Version=$version -o $pubDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $arch" }
          # MIT：发行包须附带完整许可与版权声明（见仓库根目录 LICENSE）。
          Copy-Item LICENSE $pubDir/LICENSE
          Write-Host "::endgroup::"

          # 拉取上一版本作为增量差分基准；首个版本无历史，失败可忽略。
          # packId 已从 Starward 改为 Moonward：旧品牌 nupkg 不能作 delta 基线，下载后会过滤掉。
          Write-Host "::group::Download previous release ($channel)"
          $dlArgs = @("download", "github", "--repoUrl", $env:RepoUrl, "--channel", $channel, "--token", $env:GITHUB_TOKEN)
          if ($pre) { $dlArgs += "--pre" }
          vpk @dlArgs
          # Velopack 默认把历史包落到 ./releases。
          # 只删旧 packId「Starward*」基线 nupkg/安装包，避免误用；
          # 切勿按「非 Moonward」删——会把本轮已 pack 的 assets/RELEASES 索引一并删掉
          #（下一架构 download 时发生，导致 upload 找不到 assets.win-x64.json）。
          if (Test-Path "releases") {
            Get-ChildItem "releases" -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)^Starward' } |
              ForEach-Object {
                Write-Host "Remove Starward baseline: $($_.Name)"
                Remove-Item $_.FullName -Force
              }
          }
          Write-Host "::endgroup::"

          # 打包：生成 Setup.exe + 便携 zip + full/delta nupkg + releases.$channel.json
          Write-Host "::group::Pack $channel"
          vpk pack `
            --packId Moonward `
            --packVersion $version `
            --packDir $pubDir `
            --mainExe Moonward.exe `
            --packTitle Moonward `
            --packAuthors "Scighost,TurmoilZoom" `
            --icon src/logo.ico `
            --instLicense "$pubDir/LICENSE" `
            --channel $channel `
            --delta BestSpeed
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed for $arch" }
          Write-Host "::endgroup::"
        }

    - name: Upload to GitHub Release
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $version = $env:Version
        $pre = $version.Contains("-")
        $repo = $env:GITHUB_REPOSITORY

        # 勿对每个架构分别 `vpk upload --publish`：
        # 第二次 upload 在 GetAll 未命中刚发布的 release 时会再建同 tag draft，
        # publish 时 GitHub 返回 tag_name already_exists (422)。
        # 改为：清掉同 tag 残留 release → 一次性 gh release create 挂上双架构产物。

        Write-Host "::group::Cleanup existing releases for $version"
        # 勿用 --paginate | ConvertFrom-Json（多页会拼成非法 JSON）。
        # 按页拉取，删掉同 tag 的 draft/published，便于失败重跑。
        $page = 1
        while ($true) {
          $batch = gh api "repos/$repo/releases?per_page=100&page=$page" | ConvertFrom-Json
          $items = @($batch)
          if ($items.Count -eq 0) { break }
          foreach ($rel in $items) {
            if ($rel.tag_name -eq $version) {
              Write-Host "Delete release id=$($rel.id) draft=$($rel.draft) (tag $version)"
              gh api -X DELETE "repos/$repo/releases/$($rel.id)"
            }
          }
          if ($items.Count -lt 100) { break }
          $page++
        }
        Write-Host "::endgroup::"

        $releaseDir = @("releases", "Releases") | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $releaseDir) { throw "releases directory not found after pack" }

        # 上传安装包/差分与 releases.{channel}.json；assets.*.json 仅供本地 vpk upload 使用。
        $files = @(Get-ChildItem $releaseDir -File | Where-Object {
          $_.Name -match '^(?i)(Moonward|Starward)' -or
          $_.Name -match '^(?i)releases\.' -or
          $_.Name -match '^(?i)RELEASES'
        })
        if ($files.Count -eq 0) { throw "No release assets found in $releaseDir" }
        Write-Host "Uploading $($files.Count) asset(s) from $releaseDir :"
        $files | ForEach-Object { Write-Host "  $($_.Name)" }

        $createArgs = @(
          "release", "create", $version,
          "--title", $version,
          "--notes", ""
        )
        if ($pre) { $createArgs += "--prerelease" }
        $createArgs += $files.FullName
        gh @createArgs
        if ($LASTEXITCODE -ne 0) { throw "gh release create failed for $version" }

    - name: Trigger CNB build
      shell: pwsh
      env:
        CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      run: |
        $ErrorActionPreference = "Stop"
        $version = $env:Version
        $pre = $version.Contains("-")
        $body = @{
          event = "api_trigger"
          tag = $version
          env = @{
            RELEASE_TAG = $version
            IS_PRERELEASE = if ($pre) { "true" } else { "false" }
            GITHUB_REPOSITORY = "${{ github.repository }}"
          }
        } | ConvertTo-Json -Depth 4 -Compress
        $headers = @{
          Authorization = "Bearer $env:CNB_TOKEN"
          "Content-Type" = "application/json"
        }
        Write-Host "Triggering CNB api_trigger for release $version"
        Invoke-RestMethod -Uri "https://api.cnb.cool/TurmoilZoom/Starward/-/build/start" -Method Post -Headers $headers -Body $body

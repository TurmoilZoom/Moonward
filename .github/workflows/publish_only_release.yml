name: Publish Only Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (used when triggered manually)
        required: true
        type: string

permissions:
  contents: write

env:
  Version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-2025-vs2026
    env:
      Arch: ${{ matrix.arch }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build bootstrap resources
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        New-Item -ItemType Directory -Path publish/pub_res -Force | Out-Null

        dotnet publish src/Starward.Setup -o publish/pub_res-temp/ -r win-$env:Arch -p:Version=$env:Version
        Move-Item publish/pub_res-temp/Starward.Setup.exe "publish/pub_res/Starward.Setup_$env:Arch.exe" -Force
        Remove-Item publish/pub_res-temp -Recurse -Force

        $outDir = (Resolve-Path publish/pub_res).Path + [IO.Path]::DirectorySeparatorChar
        msbuild src/Starward.Launcher "-property:Configuration=Release;Platform=$env:Arch;OutDir=$outDir"
        Move-Item publish/pub_res/Starward.exe "publish/pub_res/Starward_$env:Arch.exe" -Force

    - name: Build application
      shell: pwsh
      run: ./build.ps1 -Architecture $env:Arch -Version $env:Version -Output "publish/$env:Arch/Starward"

    - name: Pack setup and portable
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $version = $env:Version
        $arch = $env:Arch
        $sevenZip = "C:\Program Files\7-Zip\7z.exe"
        if (-not (Test-Path $sevenZip)) {
          throw "7-Zip not found at $sevenZip"
        }

        $rootPath = "publish/$arch/Starward/app-$version"
        $packageDir = "publish/release/package"
        New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
        New-Item -ItemType Directory -Path src/Starward.Setup/Assets -Force | Out-Null

        Copy-Item "publish/pub_res/Starward.Setup_$arch.exe" "$rootPath/Starward.Setup.exe" -Force
        & $sevenZip a -t7z -mx=9 src/Starward.Setup/Assets/Starward.7z "$rootPath\*"
        dotnet publish src/Starward.Setup -o "publish/$arch-setup/" -r "win-$arch" -p:Version=$version
        Move-Item "publish/$arch-setup/Starward.Setup.exe" "$packageDir/Starward_Setup_${version}_$arch.exe" -Force
        Remove-Item src/Starward.Setup/Assets/Starward.7z -Force -ErrorAction SilentlyContinue
        Remove-Item "$rootPath/Starward.Setup.exe" -Force -ErrorAction SilentlyContinue
        Remove-Item "publish/$arch-setup" -Recurse -Force -ErrorAction SilentlyContinue

        Copy-Item "publish/pub_res/Starward_$arch.exe" "publish/$arch/Starward/Starward.exe" -Force
        & $sevenZip a -t7z -mx=9 "$packageDir/Starward_Portable_${version}_$arch.7z" "publish/$arch/Starward\*"

    - name: Upload package artifacts
      uses: actions/upload-artifact@v7
      with:
        name: package_${{ env.Version }}_${{ env.Arch }}
        path: publish/release/package/
        if-no-files-found: error
        retention-days: 7

  release:
    runs-on: windows-latest
    needs: build

    steps:
    - name: Download x64 package
      uses: actions/download-artifact@v8
      with:
        name: package_${{ env.Version }}_x64
        path: release/

    - name: Download arm64 package
      uses: actions/download-artifact@v8
      with:
        name: package_${{ env.Version }}_arm64
        path: release/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.Version }}
        name: ${{ env.Version }}
        generate_release_notes: true
        files: release/*
name: Feature Request
description: 功能建议或体验改进 / Suggest a feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:

  - type: markdown
    attributes:
      value: |
        感谢建议。提交前请先 [搜索已有 Issue](https://github.com/TurmoilZoom/Moonward/issues)。

        较大改动建议先在 Issue 里讨论方案，再开始编码。

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查项 / Checklist
      description: 重复建议可能不经回复直接关闭。
      options:
        - label: 我已搜索现有 Issue，确认这不是重复建议。 / I have searched existing issues.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 现在缺什么、用起来哪里不方便。不一定要已经有完整方案。
      placeholder: 例如：切换账号启动不同游戏时，每次都要重新选配置，容易点错。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议做法 / Suggested Solution
      description: 你希望怎么做。界面相关可简单描述布局或交互，不必是最终设计。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
      description: 你还考虑过哪些做法，或其它启动器里类似的功能。
    validations:
      required: false

  - type: upload
    id: mockup
    attributes:
      label: 示意 / Mockup
      description: 可选。草图、截图标注或参考图。
    validations:
      required: false

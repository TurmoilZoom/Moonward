name: Bug Report
description: 程序错误、崩溃或行为异常 / Crash, incorrect behavior, or other bugs
title: "[Bug] "
labels: ["bug"]
body:

  - type: markdown
    attributes:
      value: |
        建议在 Moonward 中打开 **设置 → 关于 → 反馈问题** 提交。软件会自动填写诊断信息，并打开日志文件夹便于上传。

        提交前请先 [搜索已有 Issue](https://github.com/TurmoilZoom/Moonward/issues)。

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查项 / Checklist
      description: 重复 Issue 可能不经回复直接关闭。
      options:
        - label: 我已搜索现有 Issue，确认这不是重复问题。 / I have searched existing issues.
          required: true

  - type: textarea
    id: bug
    attributes:
      label: 问题描述 / Description
      description: 简要说明实际发生了什么。
      placeholder: 例如：点击启动后无反应，托盘图标也不出现。
    validations:
      required: true

  - type: upload
    id: screenshot
    attributes:
      label: 截图 / Screenshots
      description: 如有界面异常、报错弹窗，请上传截图。
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 诊断信息 / Environment
      description: 从应用内「反馈问题」打开时会自动填入。网页提交请按格式手填。
      value: |
        Moonward:
        Windows:
        Architecture:
        Channel:
        Language:
        Portable:
        Removable storage:
    validations:
      required: true

  - type: upload
    id: log_file
    attributes:
      label: 日志文件 / Log file
      description: 请上传当天的日志文件（.log / .txt）。可在设置 → 文件管理 → 打开日志文件夹中找到。
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 其他信息 / Additional Context
      description: 例如最近是否更新过 Windows、杀毒软件拦截、便携安装、自定义数据目录等。
